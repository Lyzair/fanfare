name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Cache Piper voices
        uses: actions/cache@v6
        with:
          path: public/voices
          key: voices-${{ hashFiles('src/tts/voices.json', 'scripts/fetch-assets.mjs') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests/python
      - run: npm run build
      - run: npm run check:dist
      - run: npm run package:local
      - uses: actions/upload-artifact@v7
        with:
          name: fanfare-local
          path: release/fanfare-local-*.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Builds the Docker image and runs tests/docker/smoke.sh against it. Nothing is published.
  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Smoke test (build image, start with compose, check headers/MIME/no logs)
        run: tests/docker/smoke.sh

  # The image for the CPUs of a Raspberry Pi (arm64 = 64-bit OS, arm/v7 = older 32-bit OS) and PCs.
  # Built through QEMU, nothing is pushed: publishing images is a manual decision of the maintainers.
  docker-multiarch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64, arm64 and arm/v7 (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 .

  # Hosting manual: shellcheck, the reverse-proxy examples (Caddy, Traefik, nginx for Nginx Proxy Manager)
  # and the Raspberry Pi installer (--dry-run in Debian bookworm) with its Traefik + Fanfare compose file.
  hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: shellcheck
        run: shellcheck -S warning deploy/raspberry-pi/install.sh docker/entrypoint.sh tests/docker/smoke.sh tests/hosting/*.sh tests/raspberry-pi/*.sh
      - run: python -m unittest tests.python.test_hosting
      - name: Build the image once for both test scripts
        run: docker build -t fanfare:smoke .
      - name: Reverse-proxy examples (caddy validate, Traefik, nginx -t, headers, MIME, no logs)
        run: tests/hosting/validate.sh
      - name: Raspberry Pi installer (--dry-run) and appliance compose file (HTTP and opt-in HTTPS)
        run: tests/raspberry-pi/dry-run.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only this job publishes: the build job runs npm packages and gets no write token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
