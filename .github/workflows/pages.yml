name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: public/voices
          key: voices-${{ hashFiles('src/tts/voices.json', 'scripts/fetch-assets.mjs') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests/python
      - run: npm run build
      - run: npm run check:dist
      - run: npm run package:local
      - uses: actions/upload-artifact@v4
        with:
          name: fanfare-local
          path: release/fanfare-local-*.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Builds the Docker image and runs tests/docker/smoke.sh against it. Nothing is published.
  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test (build image, start with compose, check headers/MIME/no logs)
        run: tests/docker/smoke.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
