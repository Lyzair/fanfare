# Paste into the proxy host's "Advanced" tab > "Custom Nginx Configuration" (it lands in the server block).
# The Fanfare container already sends these headers, the right MIME types and the cache rules; this
# makes sure they are exactly right at the edge, without sending any of them twice.

# No access log for this host (no visitor addresses, paths or User-Agents: GDPR).
access_log off;

# Replace the upstream's copy with ours (so each header appears once).
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://localhost:* http://127.0.0.1:*; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

# Content-Type and Cache-Control come from the Fanfare container unchanged (application/wasm,
# no-cache for index.html and sw.js, a long cache for assets/). Do not turn on proxy_cache for this host.
