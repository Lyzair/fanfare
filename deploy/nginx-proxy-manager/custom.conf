# Paste into the proxy host's "Advanced" tab > "Custom Nginx Configuration" (it lands in the server block).
# The Fanfare container already sends the Content-Security-Policy, X-Content-Type-Options, Referrer-Policy and
# Permissions-Policy headers, the right MIME types (application/wasm, ...) and the cache rules (no-cache for
# index.html and sw.js, a long cache for assets/). nginx passes all of that through unchanged, also when NPM
# adds its own add_header lines (for example HSTS), so this file deliberately does not touch them.

# No access log for this host (no visitor addresses, paths or User-Agents: GDPR).
access_log off;

# Do not turn on proxy_cache or "Cache Assets" for this host: the container sets the cache rules.
